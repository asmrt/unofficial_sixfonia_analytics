name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # テストは GCP・YouTube のライブラリを偽物に差し替えて動くので、pytest だけでよい
      - run: pip install pytest
      - run: python -m pytest tests -q
